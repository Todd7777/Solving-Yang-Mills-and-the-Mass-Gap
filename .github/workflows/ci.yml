name: ci

on:
  push:
  pull_request:

jobs:
  lattice-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "lattice[test]"
      - name: Fast tests (algebra, exact 2-d solution, heat bath, gauge invariance)
        run: |
          cd lattice
          pytest -q

  monograph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-science texlive-fonts-recommended latexmk
      - name: Build theory/lattice-foundations.pdf
        run: |
          cd theory
          latexmk -pdf -interaction=nonstopmode lattice-foundations.tex
      - uses: actions/upload-artifact@v4
        with:
          name: lattice-foundations
          path: theory/lattice-foundations.pdf
