name: ci

on:
  push:
  pull_request:

jobs:
  lattice-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "lattice[test]"
      - name: Fast tests (algebra, exact 2-d solution, heat bath, gauge invariance)
        run: |
          cd lattice
          pytest -q

  monograph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-science texlive-fonts-recommended lmodern latexmk
      - name: Build the monographs (foundations, Part II, Part III)
        run: |
          cd theory
          for f in lattice-foundations infinite-volume-strong-coupling area-law-strong-coupling; do
            latexmk -pdf -interaction=nonstopmode -halt-on-error $f.tex
          done
      - uses: actions/upload-artifact@v4
        with:
          name: monographs
          path: theory/*.pdf
